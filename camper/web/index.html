<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="/manifest.webmanifest">
<title>Camper Control</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #16181d; --muted: #6b7280;
    --line: #e5e7eb; --on: #16a34a; --warn: #d97706; --bad: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --card: #1e2127; --text: #eceef2; --muted: #9aa1ad;
            --line: #2c3038; --on: #22c55e; --warn: #f59e0b; --bad: #ef4444; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         padding: env(safe-area-inset-top) 16px 32px; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0 8px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 24px 0 8px; font-weight: 600; }
  #conn { font-size: 13px; color: var(--muted); }
  #conn.down { color: var(--bad); }
  .banner { display: none; background: var(--bad); color: #fff; border-radius: 12px;
            padding: 12px 14px; margin-top: 8px; }
  .banner.show { display: block; }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .big { font-size: 30px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .err { color: var(--bad); font-size: 13px; }
  button.sw { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column;
              gap: 6px; min-height: 84px; width: 100%; background: var(--card);
              border: 1px solid var(--line); border-radius: 14px; padding: 14px;
              -webkit-tap-highlight-color: transparent; }
  button.sw:focus-visible { outline: 2px solid var(--on); outline-offset: 2px; }
  button.sw .name { font-weight: 600; }
  button.sw .st { font-size: 13px; color: var(--muted); }
  button.sw.on { border-color: var(--on); box-shadow: inset 0 0 0 1px var(--on); }
  button.sw.on .st { color: var(--on); }
  button.sw.locked { opacity: .55; cursor: not-allowed; }
  button.sw.locked .st { color: var(--bad); }
  button.sw[aria-busy="true"] { opacity: .7; }
</style>
</head>
<body>
<header>
  <h1>Camper</h1>
  <span id="conn">verbinde …</span>
</header>
<div id="banner" class="banner" role="alert"></div>

<h2>Batterie</h2>
<div id="battery" class="grid"></div>

<h2>Schalter</h2>
<div id="switches" class="grid"></div>

<h2>Temperaturen</h2>
<div id="temps" class="grid"></div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (v, unit, digits = 1) =>
  v == null ? "–" : `${(Math.abs(v) < 0.5 * 10 ** -digits ? 0 : v).toLocaleString("de-DE", { minimumFractionDigits: digits, maximumFractionDigits: digits })} ${unit}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render(state) {
  const p = state.protection;
  const banner = $("banner");
  banner.classList.toggle("show", p.active);
  banner.textContent = p.active
    ? `Unterspannungsschutz aktiv: Verbraucher abgeschaltet. Wieder freigegeben ab ${fmt(p.recover_v, "V")}.`
    : "";

  $("battery").innerHTML = state.sensors.filter((s) => s.type === "ina226").map((s) => `
    <div class="card">
      <div class="sub">${esc(s.name)}</div>
      <div class="big">${fmt(s.values.voltage, "V", 2)}</div>
      <div class="sub">${fmt(s.values.current, "A")} · ${fmt(s.values.power, "W", 0)}</div>
      ${s.error ? `<div class="err">${esc(s.error)}</div>` : ""}
    </div>`).join("");

  $("temps").innerHTML = state.sensors.filter((s) => s.type === "ds18b20").map((s) => `
    <div class="card">
      <div class="sub">${esc(s.name)}</div>
      <div class="big">${fmt(s.values.temperature, "°C")}</div>
      ${s.error ? `<div class="err">${esc(s.error)}</div>` : ""}
    </div>`).join("");

  $("switches").innerHTML = state.switches.map((s) => `
    <button class="sw ${s.on ? "on" : ""} ${s.locked ? "locked" : ""}"
            data-id="${esc(s.id)}" data-on="${s.on}" aria-pressed="${s.on}"
            ${s.locked ? 'aria-disabled="true"' : ""}>
      <span class="name">${esc(s.name)}</span>
      <span class="st">${s.locked ? "gesperrt" : s.on ? "an" : "aus"}</span>
    </button>`).join("");
}

$("switches").addEventListener("click", async (e) => {
  const btn = e.target.closest("button.sw");
  if (!btn || btn.getAttribute("aria-disabled") === "true") return;
  btn.setAttribute("aria-busy", "true");
  try {
    const res = await fetch(`/api/switches/${encodeURIComponent(btn.dataset.id)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ on: btn.dataset.on !== "true" }),
    });
    if (!res.ok) alert((await res.json()).detail || "Schalten fehlgeschlagen");
    else render(await res.json());
  } catch {
    alert("Keine Verbindung zur Steuereinheit");
  } finally {
    btn.removeAttribute("aria-busy");
  }
});

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/ws`);
  ws.onopen = () => { $("conn").textContent = "verbunden"; $("conn").className = ""; };
  ws.onmessage = (m) => render(JSON.parse(m.data));
  ws.onclose = () => {
    $("conn").textContent = "getrennt"; $("conn").className = "down";
    setTimeout(connect, 2000);
  };
}
connect();
</script>
</body>
</html>
