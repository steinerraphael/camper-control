# Camper Control – Verdrahtung des Fahrzeugs.
#
# Auf dem Pi liegt die echte Datei unter /etc/camper-control/config.yaml
# (siehe deploy/install.sh). Diese Beispieldatei nutzt den Mock-Treiber und
# läuft damit auf jedem Rechner.

driver: mock          # mock | pi
poll_interval_s: 2

# Verteiler: Waveshare Modbus RTU Relay (D) am USB-RS485-Adapter.
# channel = Relais 1–8 (Aufdruck am Gehäuse). button: true = Taster am
# Eingang gleicher Nummer (DI1 für Relais 1) schaltet um, auch ohne Pi.
modbus:
  port: /dev/ttyUSB0      # USB-RS485-Adapter
  baudrate: 9600          # Werkseinstellung
  address: 1              # Werkseinstellung
  channels: 8             # Relais im Modul; freie Kanäle zeigt die App an

switches:
  - id: bed_light
    name: Licht Bett
    channel: 1
    button: true
    load_a: 0.5
    # kein shed_priority: Licht bleibt auch bei Unterspannung schaltbar
  - id: bed_usb
    name: USB-Dose Bett
    channel: 2
    button: true
    load_a: 2.0
    shed_priority: 2
  - id: water_pump
    name: Wasserhahn
    channel: 3
    button: true
    load_a: 4.0
    shed_priority: 1
  # Kanäle 4–8 frei. PV Dach nicht über ein Relais schalten – siehe
  # docs/hardware.md, Abschnitt „Solar (PV Dach)“.

# Alternative ohne Relaismodul: Relaisplatine direkt an GPIO-Pins. Dann den
# modbus-Abschnitt weglassen und je Schalter `pin:` (BCM-Nummer, nicht die
# physische Pin-Nummer) statt `channel:` angeben, Taster gibt es dann nicht:
#
#   - id: bed_light
#     name: Licht Bett
#     pin: 17
#     active_low: true

sensors:
  - type: ina226
    id: house_battery
    name: Aufbaubatterie
    bus: 1
    address: 0x40
    # 200 A / 75 mV Shunt (0,375 mΩ): Auch der Wechselrichter (Ective SSI 15,
    # 1500 W ≈ 140 A) läuft über ihn. Ohne Wechselrichter reicht 100 A / 75 mV
    # (0.00075).
    shunt_ohms: 0.000375
    capacity_ah: 230
  - type: ds18b20
    id: inside_temp
    name: Innenraum
    device_id: 28-000000000001
  - type: ds18b20
    id: fridge_temp
    name: Kühlbox innen
    device_id: 28-000000000002

protection:
  battery_sensor: house_battery
  # Ausgelegt für AGM 230 Ah. Eine AGM sollte nicht unter ~50 % entladen
  # werden (≈ 115 Ah nutzbar). 50 % entspricht ~12,3 V in Ruhe; unter
  # typischer Camper-Last (5–10 A) sackt die Spannung um 0,1–0,2 V ab,
  # daher 12,0 V als Schwelle.
  # Freigabe erst bei 12,8 V: Nach dem Abschalten erholt sich eine AGM
  # in Ruhe auf ~12,3 V. Die Sperre endet also erst, wenn wirklich geladen
  # wird (Lichtmaschine, Solar, Landstrom), nicht schon durch die Erholung.
  # LiFePO4 hat eine flache Kurve: Werte dann an Batterie/BMS anpassen.
  cutoff_v: 12.0
  recover_v: 12.8
  cutoff_delay_s: 30
