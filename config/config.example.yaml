# Camper Control – Verdrahtung des Fahrzeugs.
#
# Auf dem Pi liegt die echte Datei unter /etc/camper-control/config.yaml
# (siehe deploy/install.sh). Diese Beispieldatei nutzt den Mock-Treiber und
# läuft damit auf jedem Rechner.

driver: mock          # mock | pi
poll_interval_s: 2

switches:
  # pin = BCM-GPIO-Nummer (nicht die physische Pin-Nummer am Header!)
  - id: interior_lights
    name: Innenbeleuchtung
    pin: 17
    active_low: true
    load_a: 2.0
    shed_priority: 3
  - id: reading_lights
    name: Leselampen
    pin: 27
    active_low: true
    load_a: 0.5
    shed_priority: 2
  - id: water_pump
    name: Wasserpumpe
    pin: 22
    active_low: true
    load_a: 4.0
    shed_priority: 1
  - id: fridge
    name: Kühlbox
    pin: 23
    active_low: true
    load_a: 3.5
    shed_priority: 4
  - id: usb_sockets
    name: USB-Steckdosen
    pin: 24
    active_low: true
    load_a: 1.0
    shed_priority: 2
  - id: roof_fan
    name: Dachlüfter
    pin: 25
    active_low: true
    load_a: 1.5
    # kein shed_priority: wird bei Unterspannung nicht abgeschaltet

sensors:
  - type: ina226
    id: house_battery
    name: Aufbaubatterie
    bus: 1
    address: 0x40
    # 100 A / 75 mV Shunt. Reicht für 230 Ah AGM ohne Wechselrichter;
    # mit Wechselrichter > 1000 W einen 200-A-Shunt nehmen (0.000375).
    shunt_ohms: 0.00075
    capacity_ah: 230
  - type: ds18b20
    id: inside_temp
    name: Innenraum
    device_id: 28-000000000001
  - type: ds18b20
    id: fridge_temp
    name: Kühlbox innen
    device_id: 28-000000000002

protection:
  battery_sensor: house_battery
  # Ausgelegt für AGM 230 Ah. Eine AGM sollte nicht unter ~50 % entladen
  # werden (≈ 115 Ah nutzbar). 50 % entspricht ~12,3 V in Ruhe; unter
  # typischer Camper-Last (5–10 A) sackt die Spannung um 0,1–0,2 V ab,
  # daher 12,0 V als Schwelle.
  # Freigabe erst bei 12,8 V: Nach dem Abschalten erholt sich eine AGM
  # in Ruhe auf ~12,3 V. Die Sperre endet also erst, wenn wirklich geladen
  # wird (Lichtmaschine, Solar, Landstrom), nicht schon durch die Erholung.
  # LiFePO4 hat eine flache Kurve: Werte dann an Batterie/BMS anpassen.
  cutoff_v: 12.0
  recover_v: 12.8
  cutoff_delay_s: 30
